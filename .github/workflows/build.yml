name: Test and build AI-ditor Plus
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
  browser:
    name: Browser workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_workflow.py
      - run: python tests/browser_races.py
      - run: python tests/browser_downloads.py
      - run: python tests/browser_docx.py
      - run: python tests/browser_scholarly.py
      - run: python tests/browser_bilingual_panel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: .qa/
  build-mac:
    name: macOS installer
    needs: [test, browser]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIditorPlus-macOS
          path: dist/AIditorPlus_Installer.dmg
  build-windows:
    name: Windows installer
    needs: [test, browser]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - run: python -m PyInstaller aiditor_plus_windows.spec --noconfirm
      - run: python scripts/check_package_exports.py dist/AIditorPlus.exe
      - name: Create installer
        run: |
          choco install innosetup --no-progress -y
          iscc aiditor_plus_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AIditorPlus-Windows
          path: dist/AIditorPlus_Setup.exe
  release:
    name: Publish tested release
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AIditorPlus-*
          merge-multiple: true
          path: release/
      - name: Checksums
        run: cd release && sha256sum *.dmg *.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: AI-ditor Plus ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Akademik dergi editörlerinin işlerini kolaylaştırmak için kâr amacı güdülmeden geliştirilen, MIT lisanslı açık kaynak uygulama.

            2.3.0: Yeni “İki dilli kutulu kapak” şablonunda künye şeridi, Türkçe ve İngilizce özet panelleri ve tek/çift sayfa üst bilgileri bulunur. Dergi adı, ISSN, web adresi ve logo hesabınızdan alınır; örnek şablonda gerçek dergi kimliği bulunmaz. Word ve LaTeX çıktısı desteklenir.

            Beşinci hazır şablon “Sosyal bilimler”: logolu gri künye, ortalanmış başlık, 2,5 cm yan kenar boşluğu, 1,5 satır aralığı ve ayrı sayfada İngilizce özet. Özelleştirilebilir “Extended Summary” başlığı ve üst bilgilerde otomatik sayfa aralığı. Word ve LaTeX desteği.

            Dergi hesapları, kalıcı ön ayarlar, logolar, düzenlenebilir Word çıktısı, tek/çift sayfa üst ve alt bilgileri, atıftan kaynakçaya bağlantılar ve JSON yedekleri korunur. Word ile PDF arasında satır ve sayfa sonları değişebilir. MIT lisanslı ve kâr amacı gütmeyen akademik destek uygulamasıdır.

            Hesaplar bu bilgisayardaki kuruluma aittir. Bulut hesabı veya cihazlar arası otomatik eşitleme yoktur.

            macOS 13 veya üzeri: DMG dosyasını açıp uygulamayı Applications klasörüne sürükleyin. İlk açılışta macOS Gizlilik ve Güvenlik bölümünden uygulamaya izin vermeniz gerekebilir. Windows: Setup.exe dosyasını çalıştırın; WebView2 gerektirir. ZIP çıktısı Overleaf üzerinde XeLaTeX ile derlenir.
          files: release/*
