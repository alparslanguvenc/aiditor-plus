name: Test and build AI-ditor Plus
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
  browser:
    name: Browser workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_workflow.py
      - run: python tests/browser_races.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: .qa/
  build-mac:
    name: macOS installer
    needs: [test, browser]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIditorPlus-macOS
          path: dist/AIditorPlus_Installer.dmg
  build-windows:
    name: Windows installer
    needs: [test, browser]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - run: python -m PyInstaller aiditor_plus_windows.spec --noconfirm
      - name: Create installer
        run: |
          choco install innosetup --no-progress -y
          iscc aiditor_plus_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AIditorPlus-Windows
          path: dist/AIditorPlus_Setup.exe
  release:
    name: Publish tested release
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AIditorPlus-*
          merge-multiple: true
          path: release/
      - name: Checksums
        run: cd release && sha256sum *.dmg *.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: AI-ditor Plus ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Akademik dergi editörlerinin işlerini kolaylaştırmak için kâr amacı güdülmeden geliştirilen, MIT lisanslı açık kaynak uygulama.

            Sade A monogramı ve turkuaz artı işaretiyle yenilenen lacivert/fildişi logo, arayüzde ve macOS/Windows uygulama simgelerinde ortak bir görsel kimlik sunar.

            Dergi hesapları, kalıcı ön ayarlar ve logolar; dört özelleştirilebilir sayfa düzeni; Word/Excel tabloları; otomatik kaydedilen makale arşivi ve taşınabilir JSON yedekleri.

            2.0.2: Önceki kurulumlardan kalan dergi profillerini otomatik keşfetme ve içe aktarma kaldırıldı. Her hesap kendi dergi ayarlarını kullanır; JSON yedekleme ve içe aktarma devam eder.

            Hesaplar bu bilgisayardaki kuruluma aittir. Bulut hesabı veya cihazlar arası otomatik eşitleme yoktur.

            macOS: DMG dosyasını açıp uygulamayı Applications klasörüne sürükleyin. İlk açılışta macOS Gizlilik ve Güvenlik bölümünden uygulamaya izin vermeniz gerekebilir. Windows: Setup.exe dosyasını çalıştırın; WebView2 gerektirir. ZIP çıktısı Overleaf üzerinde XeLaTeX ile derlenir.
          files: release/*
